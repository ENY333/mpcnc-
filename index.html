<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CNC Studio</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <nav class="menubar">
    <button>Tệp</button><button>Chỉnh sửa</button><button>Xem</button><button>Mô phỏng</button><button>Kiểm tra</button><button>Học CNC</button>
  </nav>

  <section class="toolbar">
    <button id="newBtn">＋ Mới</button>
    <button id="openBtn">📂 Mở</button>
    <button id="saveBtn">💾 Tải</button>
    <span class="sep"></span>
    <button id="runBtn" class="primary">▶ Chạy</button>
    <button id="pauseBtn">Ⅱ Dừng</button>
    <button id="stopBtn" class="danger">■ Stop</button>
    <button id="stepBtn">⏭ Bước</button>
    <button id="resetBtn">↻ Reset</button>
    <span class="sep"></span>
    <button id="millingBtn" class="mode active">PHAY</button>
    <button id="turningBtn" class="mode">TIỆN</button>
    <input id="fileInput" type="file" accept=".nc,.cnc,.gcode,.txt" hidden>
  </section>

  <main class="workspace">
    <section class="editor-panel">
      <div class="panel-head"><span class="tab active">program.txt</span></div>
      <div class="editor-wrap">
        <div id="lineNumbers" class="line-numbers"></div>
        <textarea id="code" spellcheck="false" wrap="off" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>
    </section>

    <section class="view-panel">
      <div class="view-head"><strong>2D</strong></div>
      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
        <div id="emptyHint">Nhập G-code để xem bản vẽ</div>
        <div id="pointInfo" class="point-info hidden"></div>
      </div>
    </section>
  </main>
</div>
<script src="cnc-engine.js"></script>
<script src="app.js?v=5.0"></script>
</body>
</html>
