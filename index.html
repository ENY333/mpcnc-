<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

<header class="topbar">
    <div class="brand">
        <div class="brand-icon">C</div>
        <div>
            <div class="brand-name">CNC Studio</div>
            <div class="brand-sub">Web v3 · CNC Simulator</div>
        </div>
    </div>

    <div class="connection">
        <span class="status-dot"></span>
        Offline / GitHub Pages
    </div>
</header>

<nav class="menu">
    <div>Tệp</div>
    <div>Chỉnh sửa</div>
    <div>Xem</div>
    <div>Mô phỏng</div>
    <div>Kiểm tra</div>
    <div>Học CNC</div>

    <div class="controller">
        <span>Controller</span>
        <select>
            <option>FANUC</option>
        </select>
        <button>FANUC</button>
    </div>
</nav>

<main class="workspace">

    <!-- CODE PANEL -->
    <section class="code-panel">

        <div class="panel-tab">
            <span>program.nc</span>
        </div>

        <div class="code-area" id="codeArea">
            <!-- G-code sẽ được JS đưa vào đây -->
        </div>

    </section>

    <!-- GRAPH PANEL -->
    <section class="graph-panel">

        <div class="graph-header">
            <div class="graph-title">2D</div>

            <div class="coordinates">
                <span>X <b id="coordX">0.000</b></span>
                <span>Y <b id="coordY">0.000</b></span>
                <span>...</span>
            </div>
        </div>

        <div class="drawing-area" id="drawingArea">
            <!-- Canvas vẽ CNC nằm ở đây -->
            <canvas id="cncCanvas"></canvas>
        </div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
