name: Build Windows app
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'app.js'
      - 'cnc-engine.js'
      - 'index.html'
      - 'styles.css'
      - 'package*.json'
      - '.github/workflows/windows-app.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: CNC-Note-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
